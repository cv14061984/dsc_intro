# =========================================================================
# Configuration Template for SFTP to Azure Batch Integration
# Copy this to src/main/resources/properties/{env}.properties and update
# =========================================================================

# -------------------------------------------------------------------------
# SFTP Configuration
# -------------------------------------------------------------------------
# SFTP server hostname or IP address
sftp.host=your-sftp-host.example.com

# SFTP server port (default SSH port is 22)
sftp.port=22

# SFTP authentication credentials
sftp.username=your_sftp_username
sftp.password=your_sftp_password

# SFTP directory paths (must exist on the server)
# Input: Where CSV files are placed for processing
sftp.input.directory=/upload/input

# Working: Temporary directory during processing (optional)
sftp.working.directory=/upload/processing

# Archive: Successfully processed files are moved here
sftp.archive.directory=/upload/archive

# Error: Failed files are moved here
sftp.error.directory=/upload/error

# -------------------------------------------------------------------------
# Azure Storage Configuration
# -------------------------------------------------------------------------
# Azure Storage Account name
# Find in Azure Portal: Storage Account → Access Keys
azure.storage.account.name=yourstorageaccount

# Azure Storage Account Key (base64 encoded)
# Find in Azure Portal: Storage Account → Access Keys → key1 or key2
# IMPORTANT: Keep this secret! Consider using secure properties encryption
azure.storage.account.key=your_base64_encoded_storage_key

# Azure Blob Storage container name
# Must be created in advance in Azure Portal
azure.storage.container.name=target

# Azure Storage API version (use latest stable version)
azure.storage.api.version=2021-08-06

# Azure Blob Storage endpoint URL
azure.blob.endpoint=https://yourstorageaccount.blob.core.windows.net

# -------------------------------------------------------------------------
# SAS Token Configuration
# -------------------------------------------------------------------------
# Token expiry time in minutes
# Recommended: 30-60 minutes for production
# Higher values = less secure but more tolerant of delays
azure.sas.token.expiry.minutes=60

# SAS token permissions (combination of: r, a, c, w, d, l)
# r = Read, a = Add, c = Create, w = Write, d = Delete, l = List
# Recommended for uploads: racw
azure.sas.permissions=racwdl

# -------------------------------------------------------------------------
# Scheduler Configuration
# -------------------------------------------------------------------------
# Scheduler frequency in milliseconds (86400000 = 24 hours)
# Only used if cron expression is not set
scheduler.frequency=86400000

# Scheduler start delay in milliseconds
scheduler.start.delay=0

# Time zone for cron scheduler
scheduler.time.zone=America/New_York

# Cron expression for scheduling
# Format: second minute hour day month weekday
# Examples:
#   0 0 2 * * ?     = Every day at 2:00 AM
#   0 30 1 * * ?    = Every day at 1:30 AM
#   0 0 */6 * * ?   = Every 6 hours
#   0 0 2 * * MON   = Every Monday at 2:00 AM
scheduler.cron.expression=0 0 2 * * ?

# -------------------------------------------------------------------------
# File Processing Configuration
# -------------------------------------------------------------------------
# File pattern to match (glob pattern)
# Examples:
#   *.csv           = All CSV files
#   data_*.csv      = CSV files starting with "data_"
#   report_*.csv    = CSV files starting with "report_"
file.pattern=*.csv

# Maximum file size in MB (files larger than this will be rejected)
file.max.size.mb=100

# Batch processing size (number of files to process concurrently)
batch.size=10

# -------------------------------------------------------------------------
# Error Handling Configuration
# -------------------------------------------------------------------------
# Maximum number of retry attempts for failed operations
max.retry.attempts=3

# Delay between retry attempts in seconds
retry.delay.seconds=5

# -------------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------------
# Log level: TRACE, DEBUG, INFO, WARN, ERROR
# Development: DEBUG
# QA: INFO
# Production: WARN or ERROR
log.level=INFO

# -------------------------------------------------------------------------
# Additional Configuration (Optional)
# -------------------------------------------------------------------------
# HTTP listener port for manual trigger endpoint
http.listener.port=8081

# HTTP connection timeout in milliseconds
http.connection.timeout=300000

# SFTP connection timeout in milliseconds
sftp.connection.timeout=30000

# =========================================================================
# Secure Properties Configuration (Optional but Recommended)
# =========================================================================
# For production, encrypt sensitive values using:
# java -cp mule-secure-configuration-property-module.jar \
#   com.mulesoft.modules.configuration.property.secure.tool.Main \
#   string encrypt Blowfish CBC YOUR_KEY "your_sensitive_value"
#
# Then replace plain values with: ![encrypted_value]
# Set encryption key via system property: -Dencryption.key=YOUR_KEY

# =========================================================================
# Environment-Specific Notes
# =========================================================================

# DEVELOPMENT (dev.properties)
# - Use DEBUG log level
# - Lower security requirements
# - Longer SAS token expiry
# - Can use test credentials

# QA (qa.properties)
# - Use INFO log level
# - Production-like settings
# - Moderate SAS token expiry
# - Use QA environment credentials

# PRODUCTION (prod.properties)
# - Use WARN or ERROR log level
# - Strict security settings
# - Shorter SAS token expiry (30 min)
# - Always use encrypted credentials
# - Enable monitoring and alerts
# - Use multiple workers in CloudHub

# =========================================================================
# Quick Validation Checklist
# =========================================================================
# [ ] SFTP credentials tested and working
# [ ] Azure storage account key verified
# [ ] Azure container exists and is accessible
# [ ] SFTP directories created
# [ ] Cron expression validated
# [ ] File patterns match expected files
# [ ] Log level appropriate for environment
# [ ] Sensitive values encrypted for production
# [ ] Time zone correct for your region
# [ ] All required properties filled in
