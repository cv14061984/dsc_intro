# Environment Configuration
env=prod

# Scheduler Configuration
scheduler.frequency=86400000
scheduler.startDelay=0
scheduler.timeUnit=MILLISECONDS

# AWS S3 Configuration
s3.region=us-east-1
s3.accessKey=${secure::s3.accessKey}
s3.secretKey=${secure::s3.secretKey}
s3.bucketName=employee-data-prod
s3.inputFolder=input
s3.archiveFolder=archive
s3.filePattern=*.csv
s3.maxFiles=8

# SFTP Configuration
sftp.host=sftp-prod.example.com
sftp.port=22
sftp.username=mule_user
sftp.password=${secure::sftp.password}
sftp.targetFolder=/Target
sftp.connectionTimeout=30000
sftp.responseTimeout=30000

# Error Handling
error.notification.email=ops-team@example.com
error.maxRetries=3
error.retryDelay=5000

# Logging
log.level=INFO
log.pattern=%d{ISO8601} %-5p [%t] %c{1}: %m%n
