# IMS SCIM API Configuration
ims.scim.host=api01.shell.com
ims.scim.port=443
ims.scim.protocol=HTTPS
ims.scim.basepath=/corp-scim-office-api/v1/api/scim
ims.scim.search.path=/search

# IMS OAuth2 Configuration
ims.oauth.tokenUrl=https://api01.shell.com/oauth/token
ims.oauth.clientId=YOUR_IMS_CLIENT_ID
ims.oauth.clientSecret=YOUR_IMS_CLIENT_SECRET
ims.oauth.scopes=read:users

# Collibra API Configuration
collibra.host=shell.collibra.com
collibra.port=443
collibra.protocol=HTTPS
collibra.basepath=/rest/2.0
collibra.users.path=/users

# Collibra OAuth2 Configuration
collibra.oauth.tokenUrl=https://shell.collibra.com/oauth/token
collibra.oauth.clientId=YOUR_COLLIBRA_CLIENT_ID
collibra.oauth.clientSecret=YOUR_COLLIBRA_CLIENT_SECRET
collibra.oauth.scopes=write:users

# Scheduler Configuration
scheduler.frequency=604800000
scheduler.startDelay=0

# Batch Configuration
batch.size=50
batch.threadCount=4

# Timeout Configuration
http.timeout=30000
http.responseTimeout=30000

# Logging
log.level=WARN

# Environment
mule.env=prod
