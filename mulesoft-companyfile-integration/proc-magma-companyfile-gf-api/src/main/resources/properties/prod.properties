# Process API - Production Environment Configuration

# API Configuration
api.name=proc-magma-companyfile-gf-api
api.version=v1
api.id=23456789

# HTTP Listener Configuration
http.listener.host=0.0.0.0
http.listener.port=8443
http.listener.basePath=/magma/companyfile/v1

# TLS/SSL Configuration
tls.keystore.type=JKS
tls.keystore.path=keystore/prod-keystore.jks
tls.truststore.type=JKS
tls.truststore.path=truststore/prod-truststore.jks

# System API Configuration
system.api.host=prod-system-api.company.com
system.api.port=443
system.api.basePath=/grmdm/companyfile/v1

# HTTP Request Configuration
http.request.connection.idle.timeout=30000
http.request.response.timeout=120000

# Logging Configuration
logging.level=WARN

# Environment
mule.env=prod
