# Experience API - Production Environment Configuration

# API Configuration
api.name=exp-simp-companyfile-gf-api
api.version=v1
api.id=12345678

# HTTP Listener Configuration
http.listener.host=0.0.0.0
http.listener.port=8443
http.listener.basePath=/simp/companyfile/v1

# TLS/SSL Configuration
tls.keystore.type=JKS
tls.keystore.path=keystore/prod-keystore.jks
tls.truststore.type=JKS
tls.truststore.path=truststore/prod-truststore.jks

# Process API Configuration
process.api.host=prod-process-api.company.com
process.api.port=443
process.api.basePath=/magma/companyfile/v1

# HTTP Request Configuration
http.request.connection.idle.timeout=30000
http.request.response.timeout=90000

# Logging Configuration
logging.level=WARN

# Environment
mule.env=prod
