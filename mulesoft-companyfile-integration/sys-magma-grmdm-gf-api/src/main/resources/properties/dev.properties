# System API - Development Environment Configuration

# API Configuration
api.name=sys-magma-grmdm-gf-api
api.version=v1
api.id=34567890

# HTTP Listener Configuration
http.listener.host=0.0.0.0
http.listener.port=8083
http.listener.basePath=/grmdm/companyfile/v1

# TLS/SSL Configuration
tls.keystore.type=JKS
tls.keystore.path=keystore/dev-keystore.jks
tls.truststore.type=JKS
tls.truststore.path=truststore/dev-truststore.jks

# MDM Integration Type (database, http, or mock)
mdm.integration.type=mock

# MDM Database Configuration
mdm.db.host=localhost
mdm.db.port=1521
mdm.db.service.name=MDMDEV
mdm.db.pool.max.size=10
mdm.db.pool.min.size=2
mdm.db.pool.acquire.increment=1
mdm.db.pool.max.wait=30

# MDM HTTP API Configuration
mdm.api.host=dev-mdm-api.company.com
mdm.api.port=443
mdm.api.basePath=/informatica/mdm

# HTTP Request Configuration
http.request.connection.idle.timeout=30000
http.request.response.timeout=120000

# Logging Configuration
logging.level=INFO

# Environment
mule.env=dev
