# System API - Production Environment Configuration

# API Configuration
api.name=sys-magma-grmdm-gf-api
api.version=v1
api.id=34567890

# HTTP Listener Configuration
http.listener.host=0.0.0.0
http.listener.port=8443
http.listener.basePath=/grmdm/companyfile/v1

# TLS/SSL Configuration
tls.keystore.type=JKS
tls.keystore.path=keystore/prod-keystore.jks
tls.truststore.type=JKS
tls.truststore.path=truststore/prod-truststore.jks

# MDM Integration Type (database or http)
mdm.integration.type=database

# MDM Database Configuration
mdm.db.host=prod-mdm-db.company.com
mdm.db.port=1521
mdm.db.service.name=MDMPROD
mdm.db.pool.max.size=20
mdm.db.pool.min.size=5
mdm.db.pool.acquire.increment=2
mdm.db.pool.max.wait=30

# MDM HTTP API Configuration
mdm.api.host=prod-mdm-api.company.com
mdm.api.port=443
mdm.api.basePath=/informatica/mdm

# HTTP Request Configuration
http.request.connection.idle.timeout=30000
http.request.response.timeout=180000

# Logging Configuration
logging.level=WARN

# Environment
mule.env=prod
