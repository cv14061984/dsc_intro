# Environment Configuration
env=prod
app.name=exp-mdm-realestate-gf-api

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8081
http.base.path=/api/mdm/realestate/v1

# MDM Database Configuration
mdm.db.host=mdm-prod.database.local
mdm.db.port=1521
mdm.db.service=MDMPROD
mdm.db.user=mdm_reader
mdm.db.password=![encrypted_password]
mdm.db.pool.max.size=25
mdm.db.pool.min.size=5

# System API Configuration
sys.magma.grmdm.host=https://api.organization.com
sys.magma.grmdm.port=443
sys.magma.grmdm.base.path=/sys/magma/grmdm/v1
sys.magma.grmdm.client.id=prod_client_id
sys.magma.grmdm.client.secret=![encrypted_secret]

# ERS Destination API Configuration
sys.ers.realestate.host=https://api.organization.com
sys.ers.realestate.port=443
sys.ers.realestate.base.path=/sys/ers/realestate/v1
sys.ers.realestate.client.id=prod_client_id
sys.ers.realestate.client.secret=![encrypted_secret]

# Processing API Configuration
proc.magma.companyfile.host=https://api.organization.com
proc.magma.companyfile.port=443
proc.magma.companyfile.base.path=/proc/magma/companyfile/v1
proc.magma.companyfile.client.id=prod_client_id
proc.magma.companyfile.client.secret=![encrypted_secret]

# API Security
api.client.validation.enabled=true
api.rate.limit.enabled=true
api.rate.limit.per.minute=500

# Logging Configuration
log.level=INFO
log.json.enabled=true

# Error Handling
error.notification.enabled=true
error.notification.email=prod-support@organization.com

# Timeout Configuration
http.connection.timeout=30000
http.response.timeout=90000
