# Environment Configuration
env=prod
app.name=sys-ers-realestate-gf-api

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8084
http.base.path=/sys/ers/realestate/v1

# ERS SAP HANA Database Configuration
ers.db.host=ers-hana-prod.database.local
ers.db.port=30015
ers.db.name=ERSPROD
ers.db.user=ERS_API_USER
ers.db.password=![encrypted_password]
ers.db.pool.max.size=20
ers.db.pool.min.size=5

# API Security
api.client.validation.enabled=true

# Logging Configuration
log.level=INFO
log.json.enabled=true

# Timeout Configuration
http.connection.timeout=30000
http.response.timeout=90000

# Database Schema
ers.schema=ERS_REALESTATE
