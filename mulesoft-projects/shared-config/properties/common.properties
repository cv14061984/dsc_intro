# Common Properties Shared Across All APIs
# These properties can be referenced by all MuleSoft applications

# Common HTTP Settings
http.default.timeout=30000
http.default.retry.count=3
http.default.retry.delay=2000

# Common Security Settings
security.tls.version=TLSv1.2
security.cipher.suites=TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

# Common Logging Settings
log.pattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] [%-5level] [%logger{36}] - %msg%n
log.max.file.size=10MB
log.max.backup.index=5

# Common Error Codes
error.code.validation=VALIDATION_ERROR
error.code.not.found=NOT_FOUND
error.code.unauthorized=UNAUTHORIZED
error.code.internal=INTERNAL_SERVER_ERROR
error.code.timeout=REQUEST_TIMEOUT
error.code.connectivity=CONNECTIVITY_ERROR

# Business Criticality
business.criticality=Financial

# Service Tier
service.tier=Maintenance

# API Version
api.version=v1
