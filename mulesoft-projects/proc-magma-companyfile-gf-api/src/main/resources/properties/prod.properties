# Environment Configuration
env=prod
app.name=proc-magma-companyfile-gf-api

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8082
http.base.path=/api/proc/magma/companyfile/v1

# MDM Experience API Configuration
exp.mdm.realestate.host=https://api.organization.com
exp.mdm.realestate.port=443
exp.mdm.realestate.base.path=/api/mdm/realestate/v1
exp.mdm.realestate.client.id=prod_client_id
exp.mdm.realestate.client.secret=![encrypted_secret]

# ERS System API Configuration
sys.ers.realestate.host=https://api.organization.com
sys.ers.realestate.port=443
sys.ers.realestate.base.path=/sys/ers/realestate/v1
sys.ers.realestate.client.id=prod_client_id
sys.ers.realestate.client.secret=![encrypted_secret]

# GRMDM System API Configuration
sys.magma.grmdm.host=https://api.organization.com
sys.magma.grmdm.port=443
sys.magma.grmdm.base.path=/sys/magma/grmdm/v1
sys.magma.grmdm.client.id=prod_client_id
sys.magma.grmdm.client.secret=![encrypted_secret]

# Processing Configuration
processing.batch.size=100
processing.max.retries=3
processing.retry.delay=5000

# Logging Configuration
log.level=INFO
log.json.enabled=true

# Timeout Configuration
http.connection.timeout=30000
http.response.timeout=90000
